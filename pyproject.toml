[project]
name = "bili-album"
version = "0.1.0"
description = "Turn Bilibili music uploads (single songs, album compilations, multi-part albums) into tagged .m4a files"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.1",
    "numpy>=2.5.5",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "shazamio>=0.9.0",
    "yt-dlp>=2026.11.23",
]

[project.scripts]
bili-album = "bili_album.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: talks to live services (opt in with -m network)"]
